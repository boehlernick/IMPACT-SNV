[project]
name = "impact-snv"
dynamic = ["version"]
description = "IMPACT-SNV pipeline for SNV/indel processing, FAVOR annotation, GDS conversion, prioritization, and IMPACT-VIS output"
requires-python = ">=3.10"
dependencies = [
  "pandas",
  "pyarrow"
]

[project.scripts]
impact-snv = "impact_snv.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["impact_snv*"]

[tool.setuptools.package-data]
impact_snv = ["resources/*.R"]

[tool.setuptools.dynamic]
version = {attr = "impact_snv.__version__"}